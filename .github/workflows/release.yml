# Publish a GitHub release tagged like v0.9.0 and this builds duskwall.zip and
# attaches it, with system.json, to that release: what the manifest URL expects.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches system.json
        run: |
          VERSION=$(jq -r .version system.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match system.json version $VERSION"
            exit 1
          fi

      - name: Build duskwall.zip
        run: bash tools/package.sh

      - name: Attach the files and notes to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/system.json dist/duskwall.zip --clobber
          if [ -s dist/release-notes.md ]; then gh release edit "$GITHUB_REF_NAME" --notes-file dist/release-notes.md; fi
